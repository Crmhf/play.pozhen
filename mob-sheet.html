<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>怪物选品墙</title>
<style>body{background:#16161c;color:#ddd;font:12px monospace;padding:16px} .grid{display:flex;flex-wrap:wrap;gap:8px}
.cell{width:190px;text-align:center;background:#1f1f26;border-radius:6px;padding:4px} .cell canvas{background:#28282f;border-radius:4px}
.fail{color:#f66}</style>
</head>
<body>
<h3>怪物选品墙 <span id="prog"></span></h3>
<div class="grid" id="grid"></div>
<script src="js/vendor/spine-canvas.js"></script>
<script>
const IDS = [];
for (let s = 1; s <= 15; s++) for (const v of ['a', 'b', 'c', 'd', 'e']) IDS.push(`guaiA${s}${v}`);
const prog = document.getElementById('prog');
async function renderOne(id) {
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = `<div>${id}</div>`;
  document.getElementById('grid').appendChild(cell);
  try {
    const am = new spine.canvas.AssetManager(`assets/spine-mobs/${id}/`);
    am.loadTextureAtlas(`${id}.atlas`);
    am.loadText(`${id}.json`);
    await new Promise((res, rej) => {
      const t0 = performance.now();
      const tick = () => {
        if (am.isLoadingComplete()) return res();
        if (performance.now() - t0 > 12000) return rej(new Error('timeout'));
        setTimeout(tick, 60);
      };
      tick();
    });
    const atlas = am.get(`${id}.atlas`);
    const json = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas));
    const data = json.readSkeletonData(am.get(`${id}.json`));
    const names = data.animations.map(a => a.name);
    const sk = new spine.Skeleton(data);
    sk.setToSetupPose();
    const st = new spine.AnimationState(new spine.AnimationStateData(data));
    st.setAnimation(0, names.includes('std') ? 'std' : names[0], true);
    st.update(0.4); st.apply(sk); sk.updateWorldTransform();
    // 用骨骼世界坐标估算包围盒（getBounds 对 3.5 mesh 兼容性差）
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const b of sk.bones) {
      if (!b.active) continue;
      minX = Math.min(minX, b.worldX); maxX = Math.max(maxX, b.worldX);
      minY = Math.min(minY, b.worldY); maxY = Math.max(maxY, b.worldY);
    }
    if (minX > maxX) { minX = -150; maxX = 150; minY = 0; maxY = 400; }
    const bw = (maxX - minX) + 260, bh = (maxY - minY) + 320;
    const cx = (minX + maxX) / 2, feetY = minY - 160;
    const cv = document.createElement('canvas'); cv.width = 180; cv.height = 180;
    const ctx = cv.getContext('2d');
    const s = Math.min(170 / bw, 172 / bh);
    ctx.translate(90 - cx * s, 176 - feetY * s);
    ctx.scale(s, -s);
    const rd = new spine.canvas.SkeletonRenderer(ctx);
    rd.triangleRendering = true;
    rd.draw(sk);
    cell.appendChild(cv);
    const tag = document.createElement('div');
    tag.textContent = names.join(' ');
    cell.appendChild(tag);
  } catch (e) {
    cell.innerHTML += `<div class="fail">FAIL</div>`;
  }
  prog.textContent = `${IDS.indexOf(id) + 1}/${IDS.length}`;
}
(async () => {
  for (const id of IDS) { if (document.hidden) break; await renderOne(id); }
  document.title = 'DONE';
})();
</script>
</body>
</html>
