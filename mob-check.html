const log = (m, ok) => { const d = document.createElement('div'); d.style.color = ok === false ? '#f66' : '#7f7'; d.textContent = m; document.getElementById('log').appendChild(d); };
(async () => {
  const fails = [];
  for (const id of IDS) {
    try {
      const am = new spine.canvas.AssetManager(`assets/spine-mobs/${id}/`);
      am.loadTextureAtlas(`${id}.atlas`);
      am.loadText(`${id}.json`);
      await new Promise((res, rej) => {
        const t0 = performance.now();
        const tick = () => { if (am.isLoadingComplete()) return res(); if (performance.now() - t0 > 15000) return rej(new Error('timeout')); setTimeout(tick, 60); };
        tick();
      });
      const data = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(am.get(`${id}.atlas`))).readSkeletonData(am.get(`${id}.json`));
      const sk = new spine.Skeleton(data);
      sk.setToSetupPose(); sk.updateWorldTransform();
      const off = new spine.Vector2(), size = new spine.Vector2();
      sk.getBounds(off, size);
      log(`${id} OK H=${Math.round(size.y)}`, true);
    } catch (e) { fails.push(id); log(`${id} FAIL ${e.message}`, false); }
  }
  log('=== FAILS: ' + (fails.join(',') || '无') + ' ===', fails.length === 0);
  document.title = 'DONE';
})();
